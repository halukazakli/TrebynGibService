# HTTPS on the host's port 443 through an nginx TLS proxy.
# Enable it with COMPOSE_FILE=compose.yaml:compose.tls.yaml in .env and put the
# certificate (full chain, PEM, as issued) and its unencrypted private key into
# CERT_DIR as tls.crt and tls.key. nginx sends the chain exactly as in tls.crt;
# Kestrel would drop cross-signed intermediates that older clients (Java) need.
services:
  trebyn-gib-service:
    # Plain HTTP stays reachable only from the server itself.
    ports: !override
      - "127.0.0.1:${HOST_PORT:-8080}:8080"

  tls-proxy:
    image: nginx:1.27-alpine
    container_name: trebyn-gib-tls
    restart: unless-stopped
    depends_on:
      - trebyn-gib-service
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_DIR:-./certs}:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
