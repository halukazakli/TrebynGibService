services:
  trebyn-gib-service:
    build: .
    image: trebyn-gib-service:latest
    container_name: trebyn-gib-service
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
